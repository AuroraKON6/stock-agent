# R08 runtime contract for a published image or a local image built by
# scripts/build_image.sh. Supply the manifest and provenance hashes from the
# trusted build result and mount its external binding.

services:
  research-api:
    image: stock-agent-research@sha256:${STOCK_AGENT_IMAGE_SHA256:?set the candidate manifest hash}
    environment:
      STOCK_AGENT_IMAGE_DIGEST: sha256:${STOCK_AGENT_IMAGE_SHA256:?set the candidate manifest hash}
      STOCK_AGENT_PROVENANCE_SHA256: ${STOCK_AGENT_PROVENANCE_SHA256:?set the expected provenance hash}
      APP_CONFIG_ROOT: /app/config
      APP_STATE_ROOT: /var/stock-agent/state
      APP_EVIDENCE_ROOT: /var/stock-agent/evidence
      APP_REPORT_ROOT: /var/stock-agent/reports
      APP_TEMP_ROOT: /tmp/stock-agent
    volumes:
      - type: bind
        source: ${STOCK_AGENT_BINDING_FILE:-./docker/image_binding.json}
        target: /app/deploy/docker/image_binding.json
        read_only: true
        bind:
          create_host_path: false
      - stock-agent-state:/var/stock-agent/state
      - stock-agent-evidence:/var/stock-agent/evidence
      - stock-agent-reports:/var/stock-agent/reports
    # No host ports published: the API serves the internal compose network
    # only (edge exposure is a later, reviewed unit).
    expose:
      - "8770"
    read_only: true
    tmpfs:
      - /tmp/stock-agent:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sqlite3; from stock_agent.runtime_layout import resolve_layout; resolve_layout(); sqlite3.connect(':memory:').execute('SELECT 1')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  stock-agent-state:
  stock-agent-evidence:
  stock-agent-reports:
