# R25 precheck (KONM-27) — temporary, isolated Compose project for the
# container-layer A41–A45 drills plus the R23/R24 checks. NOT a deployment:
# everything is synthetic replay on temp volumes, the network is internal
# (no egress path at all), and no host ports are published.
#
# The image must be built first via scripts/build_image.sh (the R08 wrapper);
# update IMAGE below to the rebuilt tag, or export R25_IMAGE.
#
# State layout note (precheck finding): the app resolves project-relative
# paths ("data/...") against PROJECT_ROOT (/app in the image), NOT against
# the APP_* roots — so the state volume is mounted at /app/data here, while
# deploy/compose.yaml mounts /var/stock-agent/state, which the task store
# never writes to. R24 backup sources must also stay inside /app, which
# forces this layout for any in-container snapshot.
#
# The image creates neither /app/data nor a writable owner for it, so the
# drill services run as root (documented scaffold around that gap; the
# R08 compose contract of a non-root app user is unchanged for real runs).
name: r25-precheck-74f4813

x-drill-base: &drill-base
  image: ${R25_IMAGE:-r25-precheck-74f4813:latest}
  user: root
  working_dir: /app
  environment: &drill-env
    APP_CONFIG_ROOT: /app/data/config
    APP_STATE_ROOT: /app/data
    APP_EVIDENCE_ROOT: /app/data/evidence_vault
    APP_REPORT_ROOT: /app/data/reports
    APP_TEMP_ROOT: /tmp/stock-agent
  volumes: &drill-volumes
    - r25-data:/app/data
    - r25-restore:/app/drill-restore
    - ../../scripts/r25_precheck_drill.py:/drills/r25_precheck_drill.py:ro
    # R24 REQUIRED_STATIC_PATHS are not shipped in the candidate image
    # (precheck finding); the drill mounts them read-only from the checkout
    # so backup-create can run. Real fix belongs to the image contents.
    - ../../pyproject.toml:/app/pyproject.toml:ro
    - ../../requirements.lock.txt:/app/requirements.lock.txt:ro
    - ../../config/watchlist.example.json:/app/config/watchlist.example.json:ro

services:
  drill:
    <<: *drill-base
    command: python /drills/r25_precheck_drill.py status

  probe:
    <<: *drill-base
    command: python /drills/r25_precheck_drill.py probe_server

  diskfull:
    image: ${R25_IMAGE:-r25-precheck-74f4813:latest}
    user: root
    working_dir: /app
    environment: *drill-env
    volumes:
      - ../../scripts/r25_precheck_drill.py:/drills/r25_precheck_drill.py:ro
    tmpfs:
      # Bounded test storage for the A44 disk-full injection only.
      - /app/data:size=8m
    command: python /drills/r25_precheck_drill.py diskfull

networks:
  default:
    internal: true  # structural no-egress guarantee: no provider can be reached

volumes:
  r25-data:
  r25-restore:
