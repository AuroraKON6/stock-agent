http_port 3128

acl connect method CONNECT
acl agent_host dstdomain -n agent_backend
acl agent_port port 5050
acl agent_url url_regex ^http://agent_backend:5050/agent-stub/
acl api_host dstdomain -n api
acl api_port port 5001
acl files_url url_regex ^http://api:5001/files/

http_access deny connect
http_access allow agent_host agent_port agent_url
http_access allow api_host api_port files_url
http_access deny all

cache deny all
forward_max_tries 1
