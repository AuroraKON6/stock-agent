http_port 3128

acl post method POST
acl replay_port port 8770
acl replay_host dstdomain -n stock-agent-r16-gateway
acl replay_url url_regex ^http://stock-agent-r16-gateway:8770/api/dify/v1/(create-research|research-status)$

http_access allow post replay_port replay_host replay_url
http_access deny all

cache deny all
forward_max_tries 1
