# Dify 1.17.1 upstream routing for a loopback HTTP listener.
map $http_upgrade $dify_connection {
    default upgrade;
    "" close;
}

server {
    listen 80 default_server;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dify_connection;
    proxy_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 3600s;

    location ~ ^/(console/api|api|v1|openapi|files|mcp|triggers)(/|$) {
        set $dify_api api:5001;
        proxy_pass http://$dify_api;
    }

    location /socket.io/ {
        set $dify_websocket api_websocket:5001;
        proxy_pass http://$dify_websocket;
    }

    location / {
        set $dify_web web:3000;
        proxy_pass http://$dify_web;
    }
}
