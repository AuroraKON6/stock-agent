map "$request_method:$request_uri" $r17_role_allowed {
    default 0;
    ~^POST:/api/dify/v1/create-research$ 1;
    ~^POST:/api/dify/v1/research-status$ 1;
    ~^POST:/api/dify/v1/role-bind$ 1;
    ~^POST:/api/dify/v1/role-step$ 1;
    ~^POST:/api/dify/v1/role-finish$ 1;
}

server {
    listen 8770 default_server;
    client_max_body_size 1m;

    location / {
        if ($r17_role_allowed = 0) { return 403; }

        proxy_pass http://127.0.0.1:8771;
        proxy_set_header Host 127.0.0.1:8771;
        proxy_set_header Origin "";
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        # A role step runs its bounded attempt inside the call (DSL read: 120s).
        proxy_read_timeout 150s;
    }
}
