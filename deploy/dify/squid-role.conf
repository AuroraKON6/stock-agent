http_port 3128

acl post method POST
acl role_port port 8770
acl role_host dstdomain -n stock-agent-r16-gateway
acl role_url url_regex ^http://stock-agent-r16-gateway:8770/api/dify/v1/(create-research|research-status|role-bind|role-step|role-finish)$

http_access allow post role_port role_host role_url
http_access deny all

cache deny all
forward_max_tries 1
