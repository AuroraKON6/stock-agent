# R16 replay candidate, based on Dify 1.17.1 (see the R16 implementation report).
name: stock-agent-r16

x-core-env: &core-env
  SECRET_KEY: ${R16_DIFY_SECRET_KEY:?set a Dify-only secret key}
  DB_TYPE: postgresql
  DB_HOST: db_postgres
  DB_PORT: "5432"
  DB_DATABASE: dify
  DB_USERNAME: dify
  DB_PASSWORD: ${R16_DB_PASSWORD:?set a Dify-only database password}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${R16_REDIS_PASSWORD:?set a Dify-only Redis password}
  CELERY_BROKER_URL: redis://:${R16_REDIS_PASSWORD:?set a Dify-only Redis password}@redis:6379/1
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  VECTOR_STORE: weaviate
  WEAVIATE_ENDPOINT: http://weaviate:8080
  WEAVIATE_GRPC_ENDPOINT: grpc://weaviate:50051
  WEAVIATE_API_KEY: ${R16_WEAVIATE_KEY:?set a Dify-only Weaviate key}
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${R16_SANDBOX_KEY:?set a Dify-only sandbox key}
  SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
  SSRF_DEFAULT_MAX_RETRIES: "0"
  PLUGIN_DAEMON_URL: http://plugin_daemon:5002
  PLUGIN_DAEMON_KEY: ${R16_PLUGIN_KEY:?set a Dify-only plugin key}
  INNER_API_KEY_FOR_PLUGIN: ${R16_PLUGIN_INNER_KEY:?set a Dify-only inner plugin key}
  AGENT_BACKEND_BASE_URL: http://agent_backend:5050
  AGENT_BACKEND_API_TOKEN: ${R16_AGENT_TOKEN:?set a Dify-only agent token}
  MARKETPLACE_ENABLED: "false"
  CHECK_UPDATE_URL: ""
  ENABLE_COLLABORATION_MODE: "true"

x-core-service: &core-service
  image: langgenius/dify-api:1.17.1@sha256:ceede5b903afaa20348f7ad80ebf847379dc56d886a99b9ec6a08913dacd7732
  depends_on:
    init_permissions:
      condition: service_completed_successfully
    db_postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    agent_backend:
      condition: service_started
  volumes:
    - app_storage:/app/api/storage
  networks: [core, code_sandbox, workflow_proxy]

x-isolated-network: &isolated-network
  driver: bridge
  internal: true
  driver_opts:
    com.docker.network.bridge.gateway_mode_ipv4: isolated

services:
  init_permissions:
    image: &busybox busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: [chown, "1001:1001", /app/api/storage]
    network_mode: none
    volumes:
      - app_storage:/app/api/storage

  api:
    <<: *core-service
    environment:
      <<: *core-env
      MODE: api
      MIGRATION_ENABLED: "true"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:5001/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api_websocket:
    <<: *core-service
    environment:
      <<: *core-env
      MODE: api
      MIGRATION_ENABLED: "false"
      SERVER_WORKER_CLASS: geventwebsocket.gunicorn.workers.GeventWebSocketWorker
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *core-service
    environment:
      <<: *core-env
      MODE: worker
      MIGRATION_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy

  worker_beat:
    <<: *core-service
    environment:
      <<: *core-env
      MODE: beat
      MIGRATION_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    networks: [core]

  web:
    image: langgenius/dify-web:1.17.1@sha256:6353fe8e04481aaef873ef7317507bfa9ac862572118fd037563a71bff9f4d08
    environment:
      SERVER_CONSOLE_API_URL: http://api:5001
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SOCKET_URL: ws://127.0.0.1:18080
      MARKETPLACE_ENABLED: "false"
    networks: [core]

  db_postgres:
    image: postgres:15.19-alpine@sha256:eab009ce9447a891d9482702d370bbf132c18563bb87cfdcc2b815c6d3b0372f
    environment:
      POSTGRES_USER: dify
      POSTGRES_DB: dify
      POSTGRES_PASSWORD: ${R16_DB_PASSWORD:?set a Dify-only database password}
    healthcheck:
      test: [CMD, pg_isready, -h, db_postgres, -U, dify, -d, dify]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dify_postgres:/var/lib/postgresql/data
    networks: [core]

  redis:
    image: redis:6.2.24-alpine@sha256:3f9c6e23ed6bea3b41d0ef709fc164c1a0b7c00d5a21a60e0e9c33ada5496881
    command: [redis-server, --requirepass, "${R16_REDIS_PASSWORD:?set a Dify-only Redis password}"]
    environment:
      REDISCLI_AUTH: ${R16_REDIS_PASSWORD:?set a Dify-only Redis password}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dify_redis:/data
    networks: [core]

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2@sha256:5c62e5cbce4c48fc770abcee71099d9de32aad3b44d12299611f8135ee412362
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
      DEFAULT_VECTORIZER_MODULE: none
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${R16_WEAVIATE_KEY:?set a Dify-only Weaviate key}
      AUTHENTICATION_APIKEY_USERS: dify
      DISABLE_TELEMETRY: "true"
    volumes:
      - dify_weaviate:/var/lib/weaviate
    networks: [core]

  sandbox:
    image: langgenius/dify-sandbox:0.2.15@sha256:750e1111426ef31a9217b81c98cccfb750f17b182af3221102e420afa9f0928e
    environment:
      API_KEY: ${R16_SANDBOX_KEY:?set a Dify-only sandbox key}
      GIN_MODE: release
      SANDBOX_PORT: "8194"
      ENABLE_NETWORK: "false"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8194/health]
    networks: [code_sandbox]

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local@sha256:34412a22d1e1d1a6c73727fef88cffbcdd9be7a21bf9ad3076b4bf5c1b88fd9b
    environment:
      DB_TYPE: postgresql
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_USERNAME: dify
      DB_PASSWORD: ${R16_DB_PASSWORD:?set a Dify-only database password}
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${R16_REDIS_PASSWORD:?set a Dify-only Redis password}
      SERVER_PORT: "5002"
      SERVER_KEY: ${R16_PLUGIN_KEY:?set a Dify-only plugin key}
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${R16_PLUGIN_INNER_KEY:?set a Dify-only inner plugin key}
      FORCE_VERIFYING_SIGNATURE: "true"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dify_plugins:/app/storage
    networks: [core]

  agent_backend:
    image: langgenius/dify-agent-backend:1.17.1@sha256:a30c039bbead65d7fd8baf8c53fc867373f515c5721e46070ce03ed04c5f1e32
    environment:
      DIFY_AGENT_REDIS_URL: redis://:${R16_REDIS_PASSWORD:?set a Dify-only Redis password}@redis:6379/2
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${R16_PLUGIN_KEY:?set a Dify-only plugin key}
      DIFY_AGENT_INNER_API_URL: http://api:5001
      DIFY_AGENT_INNER_API_KEY: ${R16_PLUGIN_INNER_KEY:?set a Dify-only inner plugin key}
      DIFY_AGENT_RUNTIME_BACKEND: local
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://local_sandbox:5004
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${R16_SHELLCTL_TOKEN:?set a Dify-only shellctl token}
      DIFY_AGENT_STUB_API_BASE_URL: http://agent_backend:5050/agent-stub
      DIFY_AGENT_SANDBOX_FILES_BASE_URL: http://api:5001
      DIFY_AGENT_SERVER_SECRET_KEY: ${R16_AGENT_SERVER_KEY:?set a Dify-only agent server key}
      DIFY_AGENT_API_TOKEN: ${R16_AGENT_TOKEN:?set a Dify-only agent token}
    depends_on:
      redis:
        condition: service_healthy
      plugin_daemon:
        condition: service_started
    networks: [core, agent_control]

  local_sandbox:
    image: langgenius/dify-agent-local-sandbox:1.17.1@sha256:f4d404c9dcdf80bd72f65e84c3f2bbd1f3404fd4b363db837176da8aaf771b1d
    environment:
      SHELLCTL_AUTH_TOKEN: ${R16_SHELLCTL_TOKEN:?set a Dify-only shellctl token}
      HTTP_PROXY: http://agent_ssrf_proxy:3128
      HTTPS_PROXY: http://agent_ssrf_proxy:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - agent_home:/home/dify
      - agent_workspace:/workspace
    networks: [agent_control, agent_proxy]

  agent_ssrf_proxy:
    image: &squid ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
      - ./squid-agent.conf:/etc/squid/squid.conf:ro
    networks: [agent_proxy, core]

  ssrf_proxy:
    image: *squid
    volumes:
      - ./squid-replay.conf:/etc/squid/squid.conf:ro
    networks: [workflow_proxy, replay_link]

  nginx:
    image: &nginx nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    volumes:
      - ./nginx-ui.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api_websocket
      - web
    ports:
      - "127.0.0.1:18080:80"
    networks: [ui_edge, core]

  stock-agent-r16-gateway:
    image: *nginx
    volumes:
      - ./nginx-replay.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [replay_link]

  replay_state_init:
    image: *busybox
    command: [chown, "1001:1001", /srv/r16/data]
    network_mode: none
    volumes:
      - replay_state:/srv/r16/data

  research_api:
    image: python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    network_mode: service:stock-agent-r16-gateway
    depends_on:
      replay_state_init:
        condition: service_completed_successfully
      stock-agent-r16-gateway:
        condition: service_started
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /app
    command: [python, -B, -u, -m, replay_api]
    environment:
      R16_APPROVED_WORKFLOW_VERSION: ${R16_APPROVED_WORKFLOW_VERSION:?set an approved replay workflow digest}
    volumes:
      - ../../stock_agent:/app/stock_agent:ro
      - ./replay_api.py:/app/replay_api.py:ro
      - type: bind
        source: ${R16_REPLAY_CREDENTIALS_FILE:?set a replay credential registry path}
        target: /etc/stock-agent/replay-credentials.json
        read_only: true
        bind:
          create_host_path: false
      - replay_state:/srv/r16/data

networks:
  ui_edge:
    driver: bridge
  core: *isolated-network
  code_sandbox: *isolated-network
  workflow_proxy: *isolated-network
  replay_link: *isolated-network
  agent_control: *isolated-network
  agent_proxy: *isolated-network

volumes:
  app_storage:
  dify_postgres:
  dify_redis:
  dify_weaviate:
  dify_plugins:
  agent_home:
  agent_workspace:
  replay_state:
