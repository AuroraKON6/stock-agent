app:
  name: Stock Agent R17 role flow
  description: Bind a frozen event task and run analysis, counter-evidence and synthesis through the controlled role API
  mode: workflow
  icon: 📋
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
kind: app
version: '0.3.1'
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: b8d4e584-e65f-5938-aeee-a47acf43507a
    name: STOCK_AGENT_SERVICE_SECRET
    value_type: secret
    value: ''
    description: Case-scoped backend service credential
  - id: bb969164-369b-52ca-9200-0bb3cc9a113e
    name: STOCK_AGENT_WORKFLOW_VERSION
    value_type: string
    value: ''
    description: Reviewed sha256 workflow version
  - id: 1059bd34-e3d8-5ca9-bbda-426aefadda5c
    name: STOCK_AGENT_ROLE_FLOW_SHA256
    value_type: string
    value: ''
    description: Approved role flow digest
  - id: d4eaf5c4-07a7-56df-b1b0-a4f90f095eb6
    name: R17_CREATE_UNCONFIRMED
    value_type: string
    value: create_unconfirmed
    description: ''
  - id: f1ed7242-fb57-5b17-b36d-fbda4c6026e2
    name: R17_BIND_UNCONFIRMED
    value_type: string
    value: bind_refused
    description: ''
  - id: 0294466b-ca36-51b5-a25e-55419f7d9b86
    name: R17_STEP_HALTED
    value_type: string
    value: step_halted
    description: ''
  - id: 797c9a5d-fbf1-5f31-a325-e6f06c5b86e3
    name: R17_FINISH_UNCONFIRMED
    value_type: string
    value: finish_refused
    description: ''
  - id: a211f35c-0ba2-5999-8e0d-6bb3871f6f1e
    name: R17_FLOW_COMPLETE
    value_type: string
    value: role_flow_complete
    description: ''
  - id: a15231b8-a8d5-594d-abda-0dc1c36de4ce
    name: R17_CASE_PATH_DEFAULT
    value_type: string
    value: /
    description: ''
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    suggested_questions: []
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: '17001'
      type: custom
      data:
        type: start
        title: Frozen event input
        variables:
        - label: title
          variable: title
          type: text-input
          max_length: 120
          options: []
          required: true
        - label: case_id
          variable: case_id
          type: text-input
          max_length: 128
          options: []
          required: true
        - label: research_question
          variable: research_question
          type: paragraph
          max_length: 2000
          options: []
          required: true
        - label: input_version
          variable: input_version
          type: number
          max_length: null
          options: []
          required: true
        - label: business_intent_id
          variable: business_intent_id
          type: text-input
          max_length: 128
          options: []
          required: true
      position:
        x: 40
        y: 140
      positionAbsolute:
        x: 40
        y: 140
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
    - id: '17011'
      type: custom
      data:
        type: http-request
        title: Create or recover task
        method: POST
        url: http://stock-agent-r16-gateway:8770/api/dify/v1/create-research
        authorization:
          type: api-key
          config:
            type: bearer
            api_key: '{{#env.STOCK_AGENT_SERVICE_SECRET#}}'
        headers: ''
        params: ''
        body:
          type: x-www-form-urlencoded
          data:
          - type: text
            key: title
            value: '{{#17001.title#}}'
          - type: text
            key: case_id
            value: '{{#17001.case_id#}}'
          - type: text
            key: research_question
            value: '{{#17001.research_question#}}'
          - type: text
            key: input_version
            value: '{{#17001.input_version#}}'
          - type: text
            key: business_intent_id
            value: '{{#17001.business_intent_id#}}'
          - type: text
            key: dify_run_id
            value: '{{#sys.workflow_run_id#}}'
          - type: text
            key: workflow_version
            value: '{{#env.STOCK_AGENT_WORKFLOW_VERSION#}}'
          - type: text
            key: execution_mode
            value: replay
        timeout:
          connect: 10
          read: 30
          write: 10
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 0
        error_strategy: default-value
        default_value:
        - key: body
          type: string
          value: '{}'
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: '{}'
      position:
        x: 344
        y: 140
      positionAbsolute:
        x: 344
        y: 140
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
